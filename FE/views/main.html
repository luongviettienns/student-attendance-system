<div class="layout-container" ng-controller="MainController">

  <!-- Sidebar -->
  <div 
    class="sidebar"
    ng-class="{
      'sidebar-open': sidebarOpen && !isMobile,
      'sidebar-collapsed': !sidebarOpen && !isMobile,
      'sidebar-mobile-open': sidebarOpen && isMobile,
      'sidebar-mobile-hidden': !sidebarOpen && isMobile
    }">

    <!-- Logo -->
    <div class="sidebar-logo">
      <i class="fa fa-graduation-cap"></i>
      <span ng-show="sidebarOpen || isMobile">EduSys</span>
    </div>

    <!-- Menu -->
    <ul class="sidebar-menu">
      <li class="menu-item" ng-class="{'centered': !sidebarOpen && !isMobile}">
        <a ui-sref="main.dashboard">
          <i class="fa fa-home"></i>
          <span ng-show="sidebarOpen || isMobile">Dashboard</span>
        </a>
      </li>

      <li class="menu-item" ng-class="{'centered': !sidebarOpen && !isMobile}">
        <a ui-sref="main.classes">
          <i class="fa fa-users"></i>
          <span ng-show="sidebarOpen || isMobile">Lớp học</span>
        </a>
      </li>

      <li class="menu-item" ng-class="{'centered': !sidebarOpen && !isMobile}">
        <a ui-sref="main.users">
          <i class="fa fa-user"></i>
          <span ng-show="sidebarOpen || isMobile">Người dùng</span>
        </a>
      </li>

      <li class="menu-item" ng-class="{'centered': !sidebarOpen && !isMobile}">
        <a ui-sref="main.profile">
          <i class="fa fa-id-card"></i>
          <span ng-show="sidebarOpen || isMobile">Hồ sơ</span>
        </a>
      </li>
    </ul>
  </div>

  <!-- Overlay cho mobile -->
  <div 
    class="overlay" 
    ng-show="isMobile && sidebarOpen"
    ng-click="toggleSidebar()">
  </div>

  <!-- Main Content -->
  <div class="main-content">
    
    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" ng-click="toggleSidebar()">
          <i class="fa fa-bars" ng-class="{'rotate-90': sidebarOpen, 'rotate-0': !sidebarOpen}"></i>
        </button>
        <h1>Hệ thống quản lý</h1>
      </div>

      <div class="topbar-actions">
        <button class="notification-btn">
          <i class="fa fa-bell"></i>
          <span class="badge">{{ notificationsCount || 0 }}</span>
        </button>

        <a ui-sref="main.profile" class="user-profile">
          <img ng-src="{{ avatarUrl || 'assets/img/default-avatar.png' }}" alt="avatar">
          <span>{{ fullName }}</span>
          <span class="role">({{ role }})</span>
        </a>

        <button ng-click="logout()" class="logout-btn">
          <i class="fa fa-sign-out-alt"></i> Đăng xuất
        </button>
      </div>
    </div>

    <!-- Nội dung -->
    <div class="content-wrapper">
      <div ui-view></div>
    </div>
  </div>
</div>
