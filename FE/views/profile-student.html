<div ng-controller="ProfileController" 
     class="max-w-2xl mx-auto p-6 bg-white shadow rounded-lg">

  <h2 class="text-xl font-bold mb-6">Thông tin cá nhân</h2>

  <!-- Avatar -->
  <div class="flex items-center space-x-6 mb-8">
    <div>
      <!-- Hiển thị preview nếu có, fallback về avatar user, cuối cùng là default -->
      <img ng-src="{{ previewAvatar || student.avatarUrl || 'assets/img/default-avatar.png' }}" 
           alt="avatar"
           class="w-28 h-28 rounded-full border object-cover shadow">
    </div>

    <div class="flex flex-col space-y-2">
      <span class="text-sm text-gray-600">Ảnh đại diện</span>

      <!-- Input file ẩn -->
      <input type="file" id="avatarInput" accept="image/*" class="hidden"
             onchange="angular.element(this).scope().previewImage(this)" />

      <div class="flex space-x-2">
        <!-- Nút chọn/đổi ảnh -->
        <button type="button"
                class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition"
                ng-click="chooseFile()">
          {{ previewAvatar ? "Đổi ảnh" : "Chọn ảnh" }}
        </button>

        <!-- Nút huỷ preview -->
        <button type="button"
                ng-if="previewAvatar"
                ng-click="previewAvatar=null; selectedFile=null; checkDirty()"
                class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600 transition">
          Huỷ
        </button>
      </div>
    </div>
  </div>

  <!-- Form thông tin -->
  <div class="space-y-5">

    <!-- Họ tên -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Họ tên</label>
      <input type="text" ng-model="student.fullName" required
             class="p-2 w-full border rounded focus:ring focus:ring-blue-200 focus:outline-none">
    </div>

    <!-- Email -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input type="email" ng-model="student.email" required
             class="p-2 w-full border rounded focus:ring focus:ring-blue-200 focus:outline-none">
    </div>

    <!-- Số điện thoại -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Số điện thoại</label>
      <input type="text" ng-model="student.phone"
             class="p-2 w-full border rounded focus:ring focus:ring-blue-200 focus:outline-none">
    </div>

    <!-- Nút lưu -->
    <div class="pt-2">
      <button type="button"
              class="px-5 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
              ng-click="updateProfile()"
              ng-disabled="!isDirty">
        Lưu thay đổi
      </button>
    </div>
  </div>
</div>
