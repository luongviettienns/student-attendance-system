<div class="min-h-screen flex items-center justify-center bg-gradient-to-r from-cyan-200 via-sky-300 to-blue-400">
  <div class="bg-white shadow-2xl rounded-2xl w-full max-w-lg p-10 transform transition-all duration-500 hover:scale-[1.02] animate-fadeIn">
    
    <!-- Logo + tiêu đề -->
    <div class="text-center mb-8">
      <i class="fa-solid fa-graduation-cap text-blue-600 text-5xl mb-3 drop-shadow"></i>
      <h2 class="text-3xl font-extrabold text-gray-800">Đăng nhập hệ thống</h2>
      <p class="text-sm text-gray-500 mt-1">Quản lý đào tạo & điểm danh sinh viên</p>
    </div>

    <!-- Form -->
    <form ng-submit="login()" novalidate class="space-y-5">

      <!-- Username -->
      <div class="relative group">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 group-hover:text-blue-500 transition">
          <i class="fa fa-user"></i>
        </span>
        <input 
          type="text"
          ng-model="form.username"
          placeholder="Tên đăng nhập"
          required
          autocomplete="username"
          class="w-full pl-10 pr-3 py-3 border rounded-lg bg-gray-50 
                 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 
                 group-hover:bg-white transition text-gray-700 shadow-sm"
        >
      </div>

      <!-- Password -->
      <div class="relative group">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 group-hover:text-blue-500 transition">
          <i class="fa fa-lock"></i>
        </span>
        <input 
          type="password"
          ng-model="form.password"
          placeholder="Mật khẩu"
          required
          autocomplete="current-password"
          class="w-full pl-10 pr-3 py-3 border rounded-lg bg-gray-50 
                 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 
                 group-hover:bg-white transition text-gray-700 shadow-sm"
        >
      </div>

      <!-- Options -->
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 cursor-pointer text-gray-600 hover:text-blue-600 transition">
          <input type="checkbox" ng-model="rememberMe" class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
          Nhớ đăng nhập
        </label>
        <!-- Bỏ hoặc để sau khi có màn forgot-password -->
        <!-- <a ui-sref="forgot-password" class="text-blue-600 hover:underline">Quên mật khẩu?</a> -->
      </div>

      <!-- Submit -->
      <button type="submit" 
        class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 
               text-white py-3 rounded-lg font-semibold shadow-lg transform transition active:scale-95 flex items-center justify-center gap-2">
        <i class="fa-solid fa-right-to-bracket"></i>
        Đăng nhập
      </button>

      <!-- Error -->
      <p class="text-center text-red-500 text-sm mt-2" ng-if="errorMessage">
        {{ errorMessage }}
      </p>
    </form>
  </div>
</div>
