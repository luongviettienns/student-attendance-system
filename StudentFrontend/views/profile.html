<div class="admin-layout">
    <!-- Sidebar -->
    <app-sidebar></app-sidebar>
    
    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <app-topbar page-title="Thông tin cá nhân"></app-topbar>
        
        <!-- Content Body -->
        <div class="content-body">
            <!-- Loading State -->
            <div ng-if="loading" class="card">
                <div class="card-body text-center">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p>Đang tải thông tin...</p>
                </div>
            </div>
            
            <!-- Profile Card -->
            <div class="card" ng-if="!loading && studentInfo">
                <div class="card-header">
                    <h3><i class="fas fa-user"></i> Thông tin sinh viên</h3>
                    <div class="card-actions" ng-if="!editing">
                        <button class="btn btn-primary" ng-click="startEdit()">
                            <i class="fas fa-edit"></i> Chỉnh sửa
                        </button>
                    </div>
                    <div class="card-actions" ng-if="editing">
                        <button class="btn btn-secondary" ng-click="cancelEdit()" style="margin-right: 10px;">
                            <i class="fas fa-times"></i> Hủy
                        </button>
                        <button class="btn btn-primary" ng-click="saveProfile()">
                            <i class="fas fa-save"></i> Lưu
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="student-profile">
                        <div class="student-avatar-large" ng-click="openAvatarModal()" style="cursor: pointer;">
                            <img ng-if="currentUser.avatarUrl" ng-src="{{currentUser.avatarUrl}}" alt="Avatar">
                            <span ng-if="!currentUser.avatarUrl">{{studentInfo.fullName ? studentInfo.fullName.charAt(0) : 'S'}}</span>
                        </div>
                        <div class="student-info-details" style="flex: 1;">
                            <div class="form-group">
                                <label>Họ và tên</label>
                                <input type="text" class="form-control" ng-model="profileForm.fullName" ng-disabled="!editing">
                            </div>
                            <div class="form-group">
                                <label>Mã sinh viên</label>
                                <input type="text" class="form-control" ng-model="profileForm.studentId" disabled>
                            </div>
                            <div class="form-group">
                                <label>Lớp</label>
                                <input type="text" class="form-control" ng-model="profileForm.className" disabled>
                            </div>
                            <div class="form-group">
                                <label>Khoa</label>
                                <input type="text" class="form-control" ng-model="profileForm.facultyName" disabled>
                            </div>
                            <div class="form-group">
                                <label>Ngành</label>
                                <input type="text" class="form-control" ng-model="profileForm.majorName" disabled>
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" class="form-control" ng-model="profileForm.email" ng-disabled="!editing">
                            </div>
                            <div class="form-group">
                                <label>Số điện thoại</label>
                                <input type="text" class="form-control" ng-model="profileForm.phone" ng-disabled="!editing">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Avatar Change Modal -->
<div ng-include="'views/partials/avatar-modal.html'"></div>
