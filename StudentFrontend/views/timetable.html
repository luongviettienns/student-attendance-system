<div class="admin-layout">
    <!-- Sidebar -->
    <app-sidebar></app-sidebar>
    
    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <app-topbar page-title="Thời khóa biểu"></app-topbar>
        
        <!-- Content Body -->
        <div class="content-body">
            <!-- Error Message -->
            <div ng-if="error" class="alert alert-danger">
                <i class="fas fa-exclamation-circle"></i> {{error}}
            </div>
            
            <!-- Loading -->
            <div ng-if="loading" class="text-center" style="padding: 40px;">
                <i class="fas fa-spinner fa-spin fa-2x"></i>
                <p>Đang tải thời khóa biểu...</p>
            </div>
            
            <!-- Timetable Content -->
            <div ng-if="!loading && studentId" class="card">
                <div class="card-header">
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                        <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <label style="font-weight: bold; white-space: nowrap;">NĂM HỌC:</label>
                                <select ng-model="selectedSchoolYearId" ng-change="onSchoolYearChange()" class="form-control" style="min-width: 150px;" ng-disabled="schoolYears.length === 0">
                                    <option value="" ng-if="schoolYears.length === 0">Đang tải...</option>
                                    <option ng-repeat="sy in schoolYears" ng-value="sy.schoolYearId">{{sy.yearCode || sy.schoolYearCode || sy.yearName}}</option>
                                </select>
                            </div>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <label style="font-weight: bold; white-space: nowrap;">TUẦN THỨ:</label>
                                <select ng-model="selectedWeek" ng-change="onWeekChange()" class="form-control" style="min-width: 300px;" ng-disabled="availableWeeks.length === 0 || !selectedSchoolYearId">
                                    <option value="" ng-if="availableWeeks.length === 0 || !selectedSchoolYearId">Đang tải...</option>
                                    <option ng-repeat="w in availableWeeks" ng-value="String(w.weekNo)">{{w.label}}</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <table class="table" style="width: 100%;">
                        <thead>
                            <tr>
                                <th style="width: 100px;">Thứ</th>
                                <th>Phiên học</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr ng-repeat="d in days">
                                <td><strong>Thứ {{d}}</strong></td>
                                <td>
                                    <div ng-if="grid[d] && grid[d].length > 0">
                                        <div ng-repeat="s in grid[d] | orderBy:'startTime'" 
                                             class="session-card" 
                                             style="margin-bottom: 10px; padding: 12px; border: 1px solid #ddd; border-radius: 6px; background: #f9f9f9;">
                                            <div style="font-weight: bold; color: #2c3e50; margin-bottom: 5px;">
                                                <i class="fas fa-book"></i> {{s.subjectName || 'N/A'}}
                                            </div>
                                            <div style="color: #555; margin-bottom: 3px;">
                                                <i class="fas fa-users"></i> Lớp: {{s.classCode || '—'}}
                                            </div>
                                            <div style="color: #555; margin-bottom: 3px;">
                                                <i class="fas fa-clock"></i> {{s.startTime || '—'}} - {{s.endTime || '—'}}
                                            </div>
                                            <div style="color: #666; font-size: 0.9em;">
                                                <i class="fas fa-door-open"></i> Phòng: {{s.roomCode || '—'}} | 
                                                <i class="fas fa-user-tie"></i> GV: {{s.lecturerName || '—'}}
                                            </div>
                                        </div>
                                    </div>
                                    <div ng-if="!grid[d] || grid[d].length === 0" style="color: #999; font-style: italic;">
                                        Không có lịch học
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
