<div class="admin-layout">
    <!-- Sidebar -->
    <app-sidebar></app-sidebar>
    
    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <app-topbar page-title="Điểm danh"></app-topbar>
        
        <!-- Content Body -->
        <div class="content-body">
            <!-- Loading State -->
            <div ng-if="loading" class="card">
                <div class="card-body text-center">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p>Đang tải dữ liệu điểm danh...</p>
                </div>
            </div>
            
            <!-- Error Message -->
            <div ng-if="error" class="alert alert-danger">
                <i class="fas fa-exclamation-circle"></i> {{error}}
            </div>
            
            <!-- Attendance Records -->
            <div class="card" ng-if="!loading && attendanceRecords.length > 0">
                <div class="card-header">
                    <h3><i class="fas fa-clipboard-check"></i> Lịch sử điểm danh</h3>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Ngày</th>
                                    <th>Môn học</th>
                                    <th>Lớp</th>
                                    <th>Giảng viên</th>
                                    <th>Trạng thái</th>
                                    <th>Ghi chú</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="record in attendanceRecords">
                                    <td>{{record.date | date:'dd/MM/yyyy'}}</td>
                                    <td>{{record.subjectName}}</td>
                                    <td>{{record.classCode}}</td>
                                    <td>{{record.lecturerName}}</td>
                                    <td>
                                        <span class="badge" ng-class="getStatusBadge(record.status)">
                                            {{getStatusText(record.status)}}
                                        </span>
                                    </td>
                                    <td>{{record.notes || '-'}}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <!-- Empty State -->
            <div ng-if="!loading && attendanceRecords.length === 0" class="card">
                <div class="card-body text-center text-muted">
                    <i class="fas fa-clipboard-list fa-3x mb-3"></i>
                    <p>Chưa có dữ liệu điểm danh</p>
                </div>
            </div>
        </div>
    </div>
</div>
