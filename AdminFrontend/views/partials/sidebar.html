<!-- Sidebar Component - Dùng chung cho tất cả views -->
<aside class="sidebar">
    <div class="sidebar-header">
        <h2><i class="fas fa-graduation-cap"></i> {{currentUser.Role || currentUser.role || 'Admin'}} Panel</h2>
        <p>Xin chào, {{currentUser.fullName || 'User'}}</p>
    </div>
    
    <nav class="sidebar-nav">
        <ul class="sidebar-menu">
            <!-- ✅ Menu động theo role từ RoleService với dropdown -->
            <li class="menu-section" ng-repeat="section in menuSections track by $index">
                <!-- Nếu là link trực tiếp (như TỔNG QUAN) -->
                <div ng-if="section.isDirectLink">
                    <a ng-href="{{buildHref(section.directPath)}}" ng-click="navigateTo(section.directPath, $event)" class="menu-direct-link" ng-class="{'active': isActive(section.directPath)}">
                        <i class="{{section.icon || 'fas fa-circle'}}"></i>
                        <span class="section-title">{{section.section}}</span>
                    </a>
                </div>
                <!-- Các sections khác là dropdown -->
                <div ng-if="!section.isDirectLink">
                    <button type="button" class="menu-section-toggle" ng-click="toggleSection($index, $event)">
                        <span class="section-title">{{section.section}}</span>
                        <i class="fas fa-chevron-right arrow" ng-class="{'open': isSectionOpen($index)}"></i>
                    </button>
                    <ul class="submenu" ng-class="{'open': isSectionOpen($index)}" ng-if="section.items && section.items.length > 0">
                        <li ng-repeat="item in section.items">
                            <a ng-href="{{buildHref(item.path)}}" ng-click="navigateTo(item.path, $event)" ng-class="{'active': isActive(item.path)}">
                                <i class="{{item.icon}}"></i>
                                <span>{{item.label}}</span>
                            </a>
                        </li>
                    </ul>
                    <div class="submenu-empty" ng-if="section.items && section.items.length === 0" ng-class="{'open': isSectionOpen($index)}">
                        <p class="empty-message">Không có menu con</p>
                    </div>
                </div>
            </li>
        </ul>
    </nav>
</aside>
