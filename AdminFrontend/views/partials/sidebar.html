<!-- Sidebar Component - Dùng chung cho tất cả views -->
<aside class="sidebar">
    <div class="sidebar-header">
        <h2><i class="fas fa-graduation-cap"></i> {{currentUser.role || 'Admin'}} Panel</h2>
        <p>Xin chào, {{currentUser.fullName || 'User'}}</p>
    </div>
    
    <nav class="sidebar-nav">
        <ul class="sidebar-menu">
            <!-- ✅ Menu động theo role từ RoleService với dropdown -->
            <li class="menu-section" ng-repeat="section in menuSections track by $index">
                <!-- If section is singleLink (e.g., TỔNG QUAN), render as direct link -->
                <a ng-if="section.singleLink && section.items && section.items.length > 0"
                   class="menu-section-toggle"
                   ng-href="{{buildHref(section.items[0].path)}}">
                    <span class="section-title">{{section.section}}</span>
                </a>
                <div ng-if="!(section.singleLink && section.items && section.items.length > 0)">
                    <button type="button" class="menu-section-toggle" ng-click="toggleSection($index)">
                        <span class="section-title">{{section.section}}</span>
                        <i class="fas fa-chevron-right arrow" ng-class="{'open': isSectionOpen($index)}"></i>
                    </button>
                    <ul class="submenu" ng-class="{'open': isSectionOpen($index)}">
                        <li ng-repeat="item in section.items">
                            <a ng-href="{{buildHref(item.path)}}" href="#" ng-class="{'active': isActive(item.path)}">
                                <i class="{{item.icon}}"></i>
                                <span>{{item.label}}</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </li>
        </ul>
    </nav>
</aside>
